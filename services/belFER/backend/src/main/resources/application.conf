belfer {
  server {
    # 8080 and 3000 belong to delFIN.
    host = "0.0.0.0"
    host = ${?BELFER_SERVER_HOST}
    port = 8081
    port = ${?BELFER_SERVER_PORT}
  }

  database {
    # Every setting here is overridable on its own, so moving belFER onto its
    # own database — or its own host — is configuration rather than a code
    # change. Sharing delFIN's instance is just the current default.
    #
    # The variables are prefixed because delFIN reads the unprefixed
    # DATABASE_URL / DATABASE_USER / DATABASE_PASSWORD. Without the prefix,
    # pointing one service at a new database would silently move the other too,
    # which is the opposite of being able to split them.
    url = "jdbc:postgresql://localhost:5432/delfin"
    url = ${?BELFER_DATABASE_URL}
    user = "delfin"
    user = ${?BELFER_DATABASE_USER}
    # Deliberately no default: the JVM should fail at startup rather than
    # silently try an empty password.
    password = ${BELFER_DATABASE_PASSWORD}

    # belFER owns a schema rather than a database for now. On a dedicated
    # database this becomes "public" and nothing else changes.
    schema = "belfer"
    schema = ${?BELFER_DATABASE_SCHEMA}

    pool-size = 10
    pool-size = ${?BELFER_DATABASE_POOL_SIZE}
  }

  fet {
    # How this machine reaches fet-cl.
    #
    # FET is a separate program, not a library, and how it is reached differs
    # by machine: a Debian box has it packaged and on the path, a laptop has
    # only the graphical build and runs the command-line one in a container.
    # Both are the same binary doing the same thing, so which it is belongs in
    # configuration rather than in code.
    #
    # `{dir}` is replaced by the working directory the run happens in, which
    # is how a container is told what to mount. Accepts either a list of
    # arguments or — as here — one string split on whitespace, so that
    # BELFER_FET_COMMAND can set it from a compose file or a unit file. Use
    # the list form if any argument has to contain a space.
    #
    # On a machine with the package installed:
    #   fet-cl --inputfile={dir}/school.fet --outputdir={dir}/out
    command = "docker run --rm -v {dir}:/data belfer-fet:local --inputfile=/data/school.fet --outputdir=/data/out"
    command = ${?BELFER_FET_COMMAND}

    # Generous, and meant to grow.
    #
    # ADR 0004 recorded two seconds for a school this size. That was measured
    # before the exporter wrote rooms. It now writes one preferred-room
    # constraint per lesson — 1146 of them over 40 rooms — and the same week
    # takes about sixty-five seconds; strip the room constraints and it is
    # back to four. See the postscript to ADR 0004 for the measurements.
    #
    # So a minute or two, and that is the floor: it is FET asked only to
    # satisfy the rules. Asking it to prefer fewer teacher windows or evener
    # days comes out of the same search.
    #
    # Thirty minutes is deliberate headroom, not an estimate. Satisfying this
    # school takes a minute or two; the run is started and polled rather than
    # waited on, so nothing is held open by a long one, and the only thing a
    # bound has to do is stop a wedged fet-cl from pinning a container for
    # ever. Set it low and the first optimisation run is cut off mid-search
    # for no reason.
    timeout = 30 minutes
    timeout = ${?BELFER_FET_TIMEOUT}

    # Not the system temporary directory: on macOS that lives under
    # /var/folders, which a container runtime does not share by default, so
    # the container starts and finds nothing. Somewhere under the user's home
    # is shared everywhere we care about, and is a predictable place to look
    # when a run goes wrong.
    work-root = ${user.home}/.belfer/fet
    work-root = ${?BELFER_FET_WORK_ROOT}
  }
}
