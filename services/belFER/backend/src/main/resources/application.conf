belfer {
  server {
    # 8080 and 3000 belong to delFIN.
    host = "0.0.0.0"
    host = ${?SERVER_HOST}
    port = 8081
    port = ${?SERVER_PORT}
  }

  database {
    # Each app in the suite gets its own schema in the shared Postgres instance.
    # The database is still named `delfin` because that is what already exists;
    # renaming it to something suite-wide is a two-line change in both services'
    # configs whenever it is worth doing.
    url = "jdbc:postgresql://localhost:5432/delfin?currentSchema=belfer"
    url = ${?DATABASE_URL}
    user = "delfin"
    user = ${?DATABASE_USER}
    # Deliberately no default: the JVM should fail at startup rather than
    # silently try an empty password.
    password = ${DATABASE_PASSWORD}
    pool-size = 10
  }
}
