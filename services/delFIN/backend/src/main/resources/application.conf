delfin {
  server {
    host = "0.0.0.0"
    host = ${?SERVER_HOST}
    port = 8080
    port = ${?SERVER_PORT}
  }

  database {
    url = "jdbc:postgresql://localhost:5432/delfin"
    url = ${?DATABASE_URL}
    user = "delfin"
    user = ${?DATABASE_USER}
    password = "delfin"
    password = ${?DATABASE_PASSWORD}
    pool-size = 10
  }
}
