delfin {
  server {
    host = "0.0.0.0"
    host = ${?SERVER_HOST}
    port = 8080
    port = ${?SERVER_PORT}
  }

  database {
    url = "jdbc:postgresql://localhost:5432/delfin"
    url = ${?DATABASE_URL}
    user = "delfin"
    user = ${?DATABASE_USER}
    password = ${DATABASE_PASSWORD}

    # delFIN owns a schema rather than the whole database, so that services
    # sharing one Postgres instance cannot collide on table names or on
    # Flyway's version counter. It lived in `public` until the suite gained a
    # second service; db/maintenance/ carries the one-off move.
    schema = "delfin"
    schema = ${?DATABASE_SCHEMA}

    pool-size = 10
  }
}
