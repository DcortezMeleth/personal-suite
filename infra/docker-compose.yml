services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-delfin}
      POSTGRES_USER: ${POSTGRES_USER:-delfin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env — copy infra/.env.example}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delfin"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Built by Bazel, not docker-compose — run once before `docker compose up`:
  #   bazel run //services/delFIN/backend:server_image_load
  #   bazel run //services/delFIN/frontend:frontend_image_load
  backend:
    image: delfin-backend:local
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-delfin}
      DATABASE_USER: ${POSTGRES_USER:-delfin}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env — copy infra/.env.example}
      SERVER_PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: delfin-frontend:local
    ports:
      - "3000:80"
    depends_on:
      - backend

  # ── belFER ─────────────────────────────────────────────────────────────────
  #
  # The second service in the suite: the school timetable planner. It shares
  # the Postgres instance and lives in its own `belfer` schema, so there is
  # nothing to create — Flyway does it on first start.
  #
  # Also built by Bazel rather than by compose:
  #   bazel run //services/belFER/backend:server_image_load
  #   bazel run //services/belFER/frontend:frontend_image_load
  #
  # The backend is then layered once more to put FET inside it, because Bazel
  # has no RUN step and the layer needs a package manager:
  #   docker compose build belfer-backend
  #
  # FET is a program the backend runs, not a service it talks to — one file
  # in, one directory out — so it lives in the image rather than beside it.
  # The alternatives were a Docker socket mounted into the service, which is
  # root on the host wearing a hat, or a sidecar with a protocol to invent.
  belfer-backend:
    build:
      context: .
      dockerfile: belfer-backend-fet.Dockerfile
      # The image underneath is cross-built for linux/amd64 — the services
      # ship for Proxmox — so the layer on top has to be too. Named rather
      # than inferred, because a builder on an arm64 laptop will otherwise
      # try to run amd64 shell commands and fail with "exec format error".
      platforms:
        - linux/amd64
    image: belfer-backend-fet:local
    platform: linux/amd64
    environment:
      # Prefixed, because delFIN reads the unprefixed DATABASE_* and pointing
      # one service at another database must not move both.
      BELFER_DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-delfin}
      BELFER_DATABASE_USER: ${POSTGRES_USER:-delfin}
      BELFER_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env — copy infra/.env.example}
      BELFER_SERVER_PORT: "8081"
      # Installed and on the path, which is what the image above arranges.
      # Overridable here rather than in the image so that pointing a run at a
      # different FET — a newer one, or one on another machine — stays a
      # compose edit.
      BELFER_FET_COMMAND: "fet-cl --inputfile={dir}/school.fet --outputdir={dir}/out"
      BELFER_FET_WORK_ROOT: /var/tmp/belfer-fet
      # Thirty minutes of search. Nothing waits on it — the run is started and
      # polled — so this only has to stop a wedged fet-cl pinning the service.
      BELFER_FET_TIMEOUT: 30 minutes
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  belfer-frontend:
    image: belfer-frontend:local
    ports:
      - "3001:80"
    depends_on:
      - belfer-backend

volumes:
  postgres_data:
