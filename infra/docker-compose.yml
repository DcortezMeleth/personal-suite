services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: delfin
      POSTGRES_USER: delfin
      POSTGRES_PASSWORD: delfin
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../db/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delfin"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: eclipse-temurin:21-jre-alpine
    working_dir: /app
    volumes:
      - ../services/delFIN/backend:/app/src:ro
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/delfin
      DATABASE_USER: delfin
      DATABASE_PASSWORD: delfin
      SERVER_PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - full

  frontend:
    image: nginx:alpine
    volumes:
      - ../services/delFIN/frontend/dist:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "3000:80"
    depends_on:
      - backend
    profiles:
      - full

volumes:
  postgres_data:
